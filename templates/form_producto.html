{% extends 'base.html' %}{% block content %}<section class="panel"><h1>{{ 'Editar prenda' if p else 'Nueva prenda' }}</h1><form method="post" class="stack"><label>Nombre<input name="nombre" value="{{ p.nombre if p else '' }}" maxlength="100" required></label><label>Categoría<select name="categoria" required>{% for c in ['Playeras','Camisas','Pantalones','Jeans','Vestidos','Faldas','Sudaderas','Chamarras','Shorts','Accesorios','Calzado','Otros'] %}<option value="{{ c }}" {% if p and p.categoria==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Talla<input name="talla" value="{{ p.talla if p else '' }}" placeholder="S, M, L, 28, Única"></label><label>Precio MXN<input type="number" step="0.01" min="0.01" name="precio" value="{{ p.precio if p else '' }}" required></label><label>Stock disponible<input type="number" min="0" name="stock" value="{{ p.stock if p else 0 }}" required></label><label>URL de imagen<input type="url" name="imagen" value="{{ p.imagen if p else '' }}" placeholder="https://..."></label><label>Descripción<textarea name="descripcion" rows="4">{{ p.descripcion if p else '' }}</textarea></label><button class="btn">Guardar producto</button></form></section>{% endblock %}
