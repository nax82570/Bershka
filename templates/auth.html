{% extends 'base.html' %}{% block content %}<section class="panel narrow"><p class="eyebrow">MI CUENTA</p><h1>{{ 'Crear cuenta' if registro else 'Iniciar sesión' }}</h1><form method="post" class="stack">{% if registro %}<label>Nombre<input name="nombre" maxlength="80" required></label>{% endif %}<label>Correo electrónico<input type="email" name="correo" required></label><label>Contraseña<input type="password" name="clave" minlength="8" required></label><button class="btn">{{ 'Registrarme' if registro else 'Entrar' }}</button></form><p>{% if registro %}<a href="{{ url_for('login') }}">Ya tengo cuenta</a>{% else %}<a href="{{ url_for('registro') }}">Crear cuenta nueva</a>{% endif %}</p></section>{% endblock %}
